[project]
name = "sky4"
version = "0.1.0"
description = ""
authors = [
    {name = "Kerbin Original",email = "aakolomeycev@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
lints = [
    "flake8 (>=7.3.0,<8.0.0)",
    "black (>=26.1.0,<27.0.0)",
    "mypy (>=1.19.1,<2.0.0)",
    "isort (>=7.0.0,<8.0.0)"
]
tests = [
    "pytest (>=9.0.2,<10.0.0)"
]

[tool.mypy]
disallow_untyped_defs = true
warn_return_any = true
exclude = ['venv', '.venv', 'src/decorators', 'src/generators']

[tool.black]
line-length = 119
exclude = '''
(
    /(
    \.git
    )/
)
'''

[tool.isort]
line_length = 119